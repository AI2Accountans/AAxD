    const btnES = document.getElementById('btnES');

    const txtTitleHeader = document.getElementById('txtTitleHeader');
    const txtFunnelHeader = document.getElementById('txtFunnelHeader');
    const txtFunnelSubHeader = document.getElementById('txtFunnelSubHeader');

    function setLanguage(lang) {
      if (lang === 'es') {
        btnES.classList.add('active');
        btnEN.classList.remove('active');
        toolSubtitle.textContent = funnelTexts.es.toolSubtitle;
        txtTitleHeader.textContent = funnelTexts.es.titleHeader;
        txtFunnelHeader.textContent = funnelTexts.es.funnelHeader;
        txtFunnelSubHeader.textContent = funnelTexts.es.funnelSubHeader;
      } else {
        btnEN.classList.add('active');
        btnES.classList.remove('active');
        toolSubtitle.textContent = funnelTexts.en.toolSubtitle;
        txtTitleHeader.textContent = funnelTexts.en.titleHeader;
        txtFunnelHeader.textContent = funnelTexts.en.funnelHeader;
        txtFunnelSubHeader.textContent = funnelTexts.en.funnelSubHeader;
      }
    }

    btnES.addEventListener('click', () => setLanguage('es'));
    btnEN.addEventListener('click', () => setLanguage('en'));

    // SVG Export Functionality
    document.getElementById('btnDownloadSvg').addEventListener('click', function() {
      const svgEl = document.getElementById('embudoAadSvg');
      const serializer = new XMLSerializer();
      let source = serializer.serializeToString(svgEl);

      if (!source.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)) {
        source = source.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
      }
      if (!source.match(/^<svg[^>]+"http\:\/\/www\.w3\.org\/1999\/xlink"/)) {
        source = source.replace(/^<svg/, '<svg xmlns:xlink="http://www.w3.org/1999/xlink"');
      }

      source = '<?xml version="1.0" standalone="no"?>\r\n' + source;
      const url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(source);

      const downloadLink = document.createElement("a");
      downloadLink.href = url;
      downloadLink.download = "pipeline_embudo_aad.svg";
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);
    });
