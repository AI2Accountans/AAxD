  <style>
    :root {
      --bg-page: #f1f5f9;

      --accent-amber: #d97706;

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      min-height: 100vh;
    }

    .toolbar {
      width: 100%;
      max-width: 1480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 12px 24px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #0f172a;
    }

    .brand-title span {
      color: #0284c7;
    }

    .brand-subtitle {
      font-size: 0.85rem;
      color: #64748b;
      border-left: 1px solid #cbd5e1;
      padding-left: 12px;
      font-weight: 600;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid #cbd5e1;
      color: #334155;
    }

    .btn-outline:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    .btn-primary {
      background: #0284c7;
      border: 1px solid #0284c7;
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #0369a1;
    }

    .lang-toggle {
      display: inline-flex;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 20px;
      padding: 2px 4px;
      gap: 2px;
    }

    .lang-btn {
      border: none;
      background: transparent;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 14px;
      cursor: pointer;
      color: #64748b;
    }

    .lang-btn.active {
      background: #0284c7;
      color: #ffffff;
    }

    .infographic-container {
      width: 100%;
      max-width: 1480px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 12px 40px -10px rgba(0, 0, 0, 0.12);
      overflow-x: auto;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .station-node {
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .station-node:hover {
      filter: drop-shadow(0 6px 16px rgba(2, 132, 199, 0.25));
    }

    a {
      text-decoration: none;
    }
    .clickable-node {
      cursor: pointer;
      transition: opacity 0.2s ease, filter 0.2s ease;
    }
    .clickable-node:hover {
      opacity: 0.88;
      filter: drop-shadow(0 4px 12px rgba(2, 132, 199, 0.35));
